# Rosário (Terço) de São Miguel Arcanjo
#
# ESTRUTURA DE EXEMPLO. Antes de gerar:
#   1. Troque cada "TODO" pelo texto exato do livreto v28_FINAL.
#   2. Confira a ordem das orações com o livreto e ajuste os segmentos.
#   3. Cole o ID da voz em "voz" (descubra com: narrar vozes).
# Enquanto houver TODO ou COLE_AQUI, `narrar gerar` se recusa a gastar créditos.

id: rosario_sao_miguel
titulo: Rosário de São Miguel Arcanjo

voz: "COLE_AQUI_O_ID_DA_VOZ"        # a mesma voz já usada no canal
modelo: eleven_multilingual_v2      # compare com eleven_flash_v2_5 (metade do preço)
formato: mp3_44100_128
ajustes:
  stability: 0.6
  similarity_boost: 0.75
  style: 0
  use_speaker_boost: true
  speed: 0.95
seed: 1                 # variantes usam seed, seed+1, seed+2...
pausa_padrao: 1.2       # segundos de silêncio depois de cada fala

# Quantas gravações diferentes de cada oração repetida, alternadas ao longo do vídeo,
# para não soar como o mesmo clipe 27 vezes.
variantes:
  ave_maria: 3
  pai_nosso: 2

